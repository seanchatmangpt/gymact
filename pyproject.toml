[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "gymact"
version = "26.8.7"
description = "Public-semantic execution profile for bounded benchmark and gym worlds"
readme = "README.md"
authors = [{ name = "Sean Chatman" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
keywords = ["benchmarks", "agents", "gym", "mcp", "fastapi", "ontology", "rdf", "shacl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.8,<5",
  "fastapi>=0.139.2,<1",
  "fastmcp>=3.4.1,<4",
  "faststream>=0.7.2,<0.8",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  # required for jsonschema's "date-time" format checker to actually run --
  # without it, `format: "date-time"` in ocel20-schema.json silently passes
  # anything, which is exactly the kind of unchecked claim this exists to
  # prevent (verified: `'date-time' not in FormatChecker().checkers` before
  # adding this).
  "rfc3339-validator>=0.1.4,<1",
  "pydantic>=2.13,<3",
  "pyshacl>=0.40,<1",
  "rdflib>=7.1,<8",
  "typer>=0.27,<1",
  "uvicorn>=0.48,<1",
]

[project.optional-dependencies]
gyms = ["gymnasium>=1.0,<2", "pettingzoo>=1.24,<2"]
# The first real gym bridge target: CUBE's own no-Docker reference benchmark
# (examples/counter-cube), vendored read-only at
# ~/autofde-lab/vendor/gyms/cube-standard (a lazy git submodule of that repo,
# pinned per docs/papers/gym-lock.ttl). Optional because cube-standard requires
# Python >=3.12 while gymact itself supports >=3.11; gated at import time via
# `pytest.importorskip("cube")` in tests, never mocked when genuinely absent.
cube = [
  "cube-standard[docker]; python_version >= '3.12'",
  "counter-cube; python_version >= '3.12'",
]

[tool.uv.sources]
cube-standard = { path = "/Users/sac/autofde-lab/vendor/gyms/cube-standard", editable = true }
counter-cube = { path = "/Users/sac/autofde-lab/vendor/gyms/cube-standard/examples/counter-cube", editable = true }

[project.scripts]
gymact = "gymact.cli:app"

[project.urls]
Homepage = "https://github.com/seanchatmangpt/gymact"
Repository = "https://github.com/seanchatmangpt/gymact"
Issues = "https://github.com/seanchatmangpt/gymact/issues"
Documentation = "https://seanchatmangpt.github.io/gymact"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "httpx2>=2.9,<3",
  "mkdocstrings[python]>=0.30,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.15,<1",
  "twine>=6,<7",
  "zensical>=0.0.51,<1",
]

[tool.coverage.run]
branch = true
source = ["src/gymact"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
# -rs: always show skip reasons in the summary, even in -q mode -- a skip
# must never be invisible. See src/gymact/standing.py for the companion
# runtime contract (GYMACT_ALLOW_DEGRADED_STANDINGS) governing when a
# missing real collaborator is allowed to become a skip at all.
addopts = "-q -rs --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.uv.build-backend]
module-root = "src"
module-name = "gymact"
