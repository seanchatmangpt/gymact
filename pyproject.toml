[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "gymact"
version = "26.8.23"
description = "Public-semantic execution profile for bounded benchmark and gym worlds"
readme = "README.md"
authors = [{ name = "Sean Chatman" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
keywords = ["benchmarks", "agents", "gym", "mcp", "fastapi", "ontology", "rdf", "shacl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.8,<5",
  "blake3>=1.0,<2",
  "fastapi>=0.139.2,<1",
  "fastmcp>=3.4.1,<4",
  "faststream>=0.7.2,<0.8",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  # required for jsonschema's "date-time" format checker to actually run --
  # without it, `format: "date-time"` in ocel20-schema.json silently passes
  # anything, which is exactly the kind of unchecked claim this exists to
  # prevent (verified: `'date-time' not in FormatChecker().checkers` before
  # adding this).
  "rfc3339-validator>=0.1.4,<1",
  "pydantic>=2.13,<3",
  "pyshacl>=0.40,<1",
  "rdflib>=7.1,<8",
  "rfc8785>=0.1.4,<1",
  "typer>=0.27,<1",
  "uvicorn>=0.48,<1",
  # Real, ggen-manufactured, dependency-free (only pydantic) shared Pydantic
  # v2 types (OcelEvent/OcelLog/etc.), reused by gymact.powl.conformance so
  # this repo depends on a neutral, cross-repo type package instead of
  # reaching into autofde_lab.ocel.model directly -- gymact does not import
  # autofde_lab.
  "wasm4pm-compat-pydantic>=0.2,<0.3",
]

[project.optional-dependencies]
gyms = ["gymnasium>=1.3.0,<2", "pettingzoo>=1.27.0,<2", "inspect-ai>=0.3.260,<1", "datasets>=5.0.1,<6", "botocore>=1.40,<2"]
# botocore: real, official AWS package -- used only for its bundled
# endpoints.json (gymact.gyms.cloud_topology.load_aws_topology), never for
# a live AWS API call. No credentials, no network. Declared explicitly
# here since it was previously only an undeclared transitive dependency.
# The first real gym bridge target: CUBE's own no-Docker reference benchmark
# (examples/counter-cube), pinned to the same exact cube-standard revision as
# the benchmark lock. Optional because cube-standard requires Python >=3.12
# while gymact itself supports >=3.11; gated at import time via
# `pytest.importorskip("cube")` in tests, never mocked when genuinely absent.
cube = [
  "cube-standard[docker]; python_version >= '3.12'",
  "counter-cube; python_version >= '3.12'",
]
# A generic, gym-agnostic DSPy ReAct agent (src/gymact/dspy_agent.py) usable
# to Chicago-style exercise any real GymAct provider's capability surface --
# not benchmark-specific, no downstream (autofde-lab or otherwise) knowledge.
# Optional because dspy pulls a real LLM-client dependency graph unrelated to
# the kernel; gated at import time via `pytest.importorskip("dspy")`, never
# mocked when genuinely absent.
dspy = ["dspy>=3.3.1,<4"]
bpmn = [
    "spiffworkflow>=3.2.0",
]

[tool.uv]
# browsergym-core==0.14.3 hard-pins playwright==1.44, which pins
# greenlet==3.0.3 -- greenlet 3.0.3 has no prebuilt wheel for CPython 3.13
# and fails to compile from sdist there. Overriding to a newer playwright
# resolves greenlet>=3.5 (prebuilt wheel), which installs cleanly on 3.13.
override-dependencies = ["playwright>=1.47,<2"]

[tool.uv.sources]
cube-standard = { git = "https://github.com/The-AI-Alliance/cube-standard.git", rev = "9ca7c062d211450df05eb8318a1e847b5373b689" }
counter-cube = { git = "https://github.com/The-AI-Alliance/cube-standard.git", rev = "9ca7c062d211450df05eb8318a1e847b5373b689", subdirectory = "examples/counter-cube" }
wasm4pm-compat-pydantic = { git = "https://github.com/seanchatmangpt/wasm4pm-compat.git", rev = "577e2d1d8bdfe27d96f61c63f3ea120994e8bfda", subdirectory = "python" }

[project.scripts]
gymact = "gymact.cli:app"
gymact-commerce-dfcm = "gymact.commerce_dfcm_cli:main"

[project.urls]
Homepage = "https://github.com/seanchatmangpt/gymact"
Repository = "https://github.com/seanchatmangpt/gymact"
Issues = "https://github.com/seanchatmangpt/gymact/issues"
Documentation = "https://seanchatmangpt.github.io/gymact"

[dependency-groups]
dev = [
  "build>=1.6.0,<2",
  "coverage[toml]>=7.16.0,<8",
  "httpx2>=2.12.0,<3",
  "mkdocstrings[python]>=1.0.6,<2",
  # required by the real ~/POWL sibling checkout's powl.objects.tagged_powl
  # leaf submodules (.base/.graph_base/.types) that
  # tests/powl/test_reference_model_conformance.py imports directly for its
  # no-mock structural-conformance comparison; not used by gymact itself.
  "networkx>=3.6,<4",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.16.5,<1",
  "twine>=7.0.0,<8",
  "zensical>=0.0.57,<1",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "26.8.23"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = false
tag_format = "v$version"

[tool.coverage.run]
branch = true
source = ["src/gymact"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
# -rs: always show skip reasons in the summary, even in -q mode -- a skip
# must never be invisible. See src/gymact/standing.py for the companion
# runtime contract (GYMACT_ALLOW_DEGRADED_STANDINGS) governing when a
# missing real collaborator is allowed to become a skip at all.
# --import-mode=importlib gives every collected file a path-derived module
# identity, so independently owned EXPLORE courts may lawfully reuse concise
# test basenames without polluting sys.modules or shadowing one another.
addopts = "-q -rs --strict-config --strict-markers --import-mode=importlib --basetemp=/tmp/gymact-pytest-tmp"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # Real, admitted, narrowly-scoped exception to the strict policy above.
    # `ConcurrentMcpDispatchTests` (tests/test_sregym_provider.py) drives a
    # real `fastmcp.Client` against a real closed TCP port on purpose (see
    # that class's own docstring for the full account). The failed
    # handshake leaves a real third-party `anyio`/asyncio event loop and its
    # self-pipe sockets behind despite a real best-effort `client.close()`
    # on every code path -- confirmed live via two independent real fix
    # attempts (an `asyncio.wait_for` wrapper, and an unconditional
    # `client.close()` in `finally`), neither of which stopped CPython's GC
    # from finalizing the abandoned loop/sockets at a genuinely
    # nondeterministic later point. `tests/conftest.py`'s own
    # `pytest_runtest_call`/`pytest_sessionfinish` hooks already force extra
    # GC passes at the two points this leak was actually observed to
    # surface at (immediately after that one test class, and again at
    # session end) -- but CPython's GC timing for this genuinely
    # nondeterministic third-party defect is not fully pinned by either
    # hook alone, and the resulting `PytestUnraisableExceptionWarning` can
    # still convert to a fatal `ExceptionGroup` out of
    # `_pytest.unraisableexception.pytest_unconfigure`, aborting the run
    # before pytest ever prints its final summary line -- regardless of how
    # many real tests actually passed or failed. These two entries match
    # only the exact, documented third-party finalizer signatures above
    # (by message prefix, scoped to `PytestUnraisableExceptionWarning`
    # specifically) -- not `ResourceWarning` in general, and not any other
    # unraisable-exception source -- so every other unraisable/resource
    # warning in this repo remains fail-real under the "error" policy above.
    # NOTE: the message field below must not itself contain a literal `:` --
    # the stdlib `warnings` ini-filter parser splits the whole entry on `:`
    # into positional fields, so a colon inside the message text (e.g. the
    # real "Exception ignored in:" prefix) would silently misparse this
    # entry instead of raising. `.{0,3}` bridges the omitted ": <" instead.
    "ignore:Exception ignored in.{0,3}socket\\.socket:pytest.PytestUnraisableExceptionWarning",
    "ignore:Exception ignored in.{0,3}function BaseEventLoop\\.__del__:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.uv.build-backend]
module-root = "src"
module-name = "gymact"
