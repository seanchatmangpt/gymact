[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[project]
name = "gymact"
version = "26.8.7"
description = "Public-semantic execution profile for bounded benchmark and gym worlds"
readme = "README.md"
authors = [{ name = "Sean Chatman" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
keywords = ["benchmarks", "agents", "gym", "mcp", "fastapi", "ontology", "rdf", "shacl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.8",
  "fastapi>=0.115",
  "fastmcp>=2.0",
  "faststream>=0.5",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyshacl>=0.30",
  "rdflib>=7.1",
  "typer>=0.15",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
gyms = ["gymnasium>=1.0", "pettingzoo>=1.24"]

[project.scripts]
gymact = "gymact.cli:app"

[project.urls]
Homepage = "https://github.com/seanchatmangpt/gymact"
Repository = "https://github.com/seanchatmangpt/gymact"
Issues = "https://github.com/seanchatmangpt/gymact/issues"
Documentation = "https://seanchatmangpt.github.io/gymact"

[dependency-groups]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mkdocstrings[python]>=0.30",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "twine>=6.0",
  "zensical>=0.0.51",
]

[tool.coverage.run]
branch = true
source = ["src/gymact"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.uv.build-backend]
module-root = "src"
module-name = "gymact"
