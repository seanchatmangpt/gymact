[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "gymact"
version = "26.8.23"
description = "Public-semantic execution profile for bounded benchmark and gym worlds"
readme = "README.md"
authors = [{ name = "Sean Chatman" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
keywords = ["benchmarks", "agents", "gym", "mcp", "fastapi", "ontology", "rdf", "shacl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.8,<5",
  "blake3>=1.0,<2",
  "fastapi>=0.139.2,<1",
  "fastmcp>=3.4.1,<4",
  "faststream>=0.7.2,<0.8",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  # required for jsonschema's "date-time" format checker to actually run --
  # without it, `format: "date-time"` in ocel20-schema.json silently passes
  # anything, which is exactly the kind of unchecked claim this exists to
  # prevent (verified: `'date-time' not in FormatChecker().checkers` before
  # adding this).
  "rfc3339-validator>=0.1.4,<1",
  "pydantic>=2.13,<3",
  "pyshacl>=0.40,<1",
  "rdflib>=7.1,<8",
  "rfc8785>=0.1.4,<1",
  "typer>=0.27,<1",
  "uvicorn>=0.48,<1",
  # Real, ggen-manufactured, dependency-free (only pydantic) shared Pydantic
  # v2 types (OcelEvent/OcelLog/etc.), reused by gymact.powl.conformance so
  # this repo depends on a neutral, cross-repo type package instead of
  # reaching into autofde_lab.ocel.model directly -- gymact does not import
  # autofde_lab.
  "wasm4pm-compat-pydantic>=0.2,<0.3",
]

[project.optional-dependencies]
gyms = ["gymnasium>=1.3.0,<2", "pettingzoo>=1.27.0,<2", "inspect-ai>=0.3.260,<1", "datasets>=5.0.1,<6", "botocore>=1.40,<2", "terminal-bench==0.2.18; python_version >= '3.12'"]
# botocore: real, official AWS package -- used only for its bundled
# endpoints.json (gymact.gyms.cloud_topology.load_aws_topology), never for
# a live AWS API call. No credentials, no network. Declared explicitly
# here since it was previously only an undeclared transitive dependency.
# terminal-bench (from agent/terminal-bench-gym triage merge): pinned real
# benchmark harness for the terminal-bench provider, python >=3.12 only.
# The first real gym bridge target: CUBE's own no-Docker reference benchmark
# (examples/counter-cube), pinned to the same exact cube-standard revision as
# the benchmark lock. Optional because cube-standard requires Python >=3.12
# while gymact itself supports >=3.11; gated at import time via
# `pytest.importorskip("cube")` in tests, never mocked when genuinely absent.
cube = [
  "cube-standard[docker]; python_version >= '3.12'",
  "counter-cube; python_version >= '3.12'",
]
# A generic, gym-agnostic DSPy ReAct agent (src/gymact/dspy_agent.py) usable
# to Chicago-style exercise any real GymAct provider's capability surface --
# not benchmark-specific, no downstream (autofde-lab or otherwise) knowledge.
# Optional because dspy pulls a real LLM-client dependency graph unrelated to
# the kernel; gated at import time via `pytest.importorskip("dspy")`, never
# mocked when genuinely absent.
dspy = ["dspy>=3.3.1,<4"]
bpmn = [
    "spiffworkflow>=3.2.0",
]
# tau2-bench (Sierra's customer-service-agent simulation benchmark),
# `vendor-tau2-bench` pin in autofde-lab's docs/papers/gym-lock.ttl. Its own
# package name ("tau2") collides with an unrelated PyPI project (Ben
# Atkinson's tau2, an unrelated numerics package) -- Sierra has never
# published under that name, so this installs the real upstream repo
# directly from git, pinned to the exact commit gym-lock.ttl admits.
# Optional because tau2 requires Python >=3.12,<3.14 while gymact itself
# supports >=3.11; gated at import time via `pytest.importorskip("tau2")`
# in tests, never mocked when genuinely absent.
tau2-bench = [
  "tau2 @ git+https://github.com/sierra-research/tau2-bench.git@668d3bcd135c02aa3438f987ef45735b7c163ee3 ; python_version >= '3.12' and python_version < '3.14'",
]

[tool.uv]
# browsergym-core==0.14.3 hard-pins playwright==1.44, which pins
# greenlet==3.0.3 -- greenlet 3.0.3 has no prebuilt wheel for CPython 3.13
# and fails to compile from sdist there. Overriding to a newer playwright
# resolves greenlet>=3.5 (prebuilt wheel), which installs cleanly on 3.13.
override-dependencies = ["playwright>=1.47,<2"]

[tool.uv.sources]
cube-standard = { git = "https://github.com/The-AI-Alliance/cube-standard.git", rev = "9ca7c062d211450df05eb8318a1e847b5373b689" }
counter-cube = { git = "https://github.com/The-AI-Alliance/cube-standard.git", rev = "9ca7c062d211450df05eb8318a1e847b5373b689", subdirectory = "examples/counter-cube" }
wasm4pm-compat-pydantic = { git = "https://github.com/seanchatmangpt/wasm4pm-compat.git", rev = "577e2d1d8bdfe27d96f61c63f3ea120994e8bfda", subdirectory = "python" }

[project.scripts]
gymact = "gymact.cli:app"
gymact-commerce-dfcm = "gymact.commerce_dfcm_cli:main"

[project.urls]
Homepage = "https://github.com/seanchatmangpt/gymact"
Repository = "https://github.com/seanchatmangpt/gymact"
Issues = "https://github.com/seanchatmangpt/gymact/issues"
Documentation = "https://seanchatmangpt.github.io/gymact"

[dependency-groups]
dev = [
  "build>=1.6.0,<2",
  "coverage[toml]>=7.16.0,<8",
  "httpx2>=2.12.0,<3",
  "mkdocstrings[python]>=1.0.6,<2",
  # required by the real ~/POWL sibling checkout's powl.objects.tagged_powl
  # leaf submodules (.base/.graph_base/.types) that
  # tests/powl/test_reference_model_conformance.py imports directly for its
  # no-mock structural-conformance comparison; not used by gymact itself.
  "networkx>=3.6,<4",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.16.5,<1",
  "twine>=7.0.0,<8",
  "zensical>=0.0.57,<1",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "26.8.23"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = false
tag_format = "v$version"

[tool.coverage.run]
branch = true
source = ["src/gymact"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
# -rs: always show skip reasons in the summary, even in -q mode -- a skip
# must never be invisible. See src/gymact/standing.py for the companion
# runtime contract (GYMACT_ALLOW_DEGRADED_STANDINGS) governing when a
# missing real collaborator is allowed to become a skip at all.
# --import-mode=importlib gives every collected file a path-derived module
# identity, so independently owned EXPLORE courts may lawfully reuse concise
# test basenames without polluting sys.modules or shadowing one another.
addopts = "-q -rs --strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# GENERATED projections (ggen renders these from pack ontologies; the owning
# generator, not the repo's hand formatter, owns their bytes). See each file's
# own "GENERATED / DO NOT HAND EDIT" header:
# - admission.py: long authority/class data lines (E501), intentional
#   prov: alias keys that repeat dict literals by design (F601), and a
#   str,Enum mixin predating StrEnum (UP042).
# - generated/: the rendered sregym MCP catalog (E501 long URI rows).
# - explore_process_convergence_correspondence/__init__.py: explicit
#   re-export surface (F401 names imported for `from x import *`-style
#   re-export, intentionally unaliased).
"src/gymact/semantics/admission.py" = ["E501", "F601", "UP042"]
"src/gymact/generated/*" = ["E501"]
"src/gymact/explore_process_convergence_correspondence/__init__.py" = ["F401"]

# UP042 deliberately NOT applied: these enums are `class X(str, Enum)` mixins
# whose `str()` output (e.g. "Standing.ALIVE") is load-bearing in rendered
# receipts and RDF literals. Converting to `enum.StrEnum` would change
# f-string/str() output to the bare value - a behavior change, not a lint fix.
# Revisit only with a deliberate serialization audit.
"src/gymact/explore_*/**" = ["UP042"]
"src/gymact/semantics/rdf_source.py" = ["UP042"]

# E501 deliberately NOT applied to long semantic data literals: capability
# titles/claims, pack gate-description tables, embedded BPMN/JSON/SQL text,
# registry optional-dependency commentary and digest-claim strings. Wrapping
# would split meaningful data across concat points for zero semantic gain;
# these lines are data, not prose.
"src/gymact/connection.py" = ["E501"]
"src/gymact/explore_certificate_federation/certificate.py" = ["E501"]
"src/gymact/gdmcp_bpmn_bridge.py" = ["E501"]
"src/gymact/gyms/chatman_state_gym.py" = ["E501"]
"src/gymact/gyms/cloud_topology_gym.py" = ["E501"]
"src/gymact/gyms/cloud_topology_validation.py" = ["E501"]
"src/gymact/gyms/k8s_resource_gym.py" = ["E501"]
"src/gymact/gyms/multicloud.py" = ["E501"]
"src/gymact/powl/guard_executor.py" = ["E501"]
"src/gymact/powl/validate.py" = ["E501"]
"src/gymact/registry.py" = ["E501"]
"src/gymact/sqlite_ledger.py" = ["E501"]
"tests/explore/test_semantic_currentness_vector.py" = ["E501"]
"tests/test_bpmn_runtime_admission_chicago.py" = ["E501"]
"tests/test_composition_inventory_completeness_chicago.py" = ["E501"]
"tests/test_multicloud.py" = ["E501"]
"tests/test_protocol_conformance.py" = ["E501"]

# E402 for standing-gated test modules: these files intentionally place their
# real-collaborator availability gates (named_standing_skip / importlib
# find_spec probes) BEFORE the gym/extra imports so an unavailable optional
# collaborator degrades the whole module to a named standing skip without
# ever importing a missing package. The imports after a gate are the point.
"tests/gyms/test_cloud_topology_unit.py" = ["E402"]
"tests/powl/test_canonical_bridge.py" = ["E402"]
"tests/powl/test_reference_model_conformance.py" = ["E402"]
"tests/test_algebra_protocols.py" = ["E402"]
"tests/test_bpmn_runtime_chicago.py" = ["E402"]
"tests/test_browsergym_edges.py" = ["E402"]
"tests/test_browsergym_gym.py" = ["E402"]
"tests/test_capability_manifest.py" = ["E402"]
"tests/test_cloud_topology.py" = ["E402"]
"tests/test_cloud_topology_validation.py" = ["E402"]
"tests/test_combinatorial_ocel.py" = ["E402"]
"tests/test_cube_container_counter.py" = ["E402"]
"tests/test_cube_counter.py" = ["E402"]
"tests/test_dspy_agent_chicago.py" = ["E402"]
"tests/test_dspy_ocel_chicago.py" = ["E402"]
"tests/test_dspy_signature_discipline.py" = ["E402"]
"tests/test_dspy_sregym_agent_chicago.py" = ["E402"]
"tests/test_dspy_verifier_chicago.py" = ["E402"]
"tests/test_gdmcp_bpmn_bridge_chicago.py" = ["E402"]
"tests/test_ggen_gym_contract.py" = ["E402"]
"tests/test_gymnasium_env.py" = ["E402"]
"tests/test_gymnasium_replay_restore_explore.py" = ["E402"]
"tests/test_inspect_evals.py" = ["E402"]
"tests/test_kubernetes_reconciliation.py" = ["E402"]
"tests/test_mcp_client_session.py" = ["E402"]
"tests/test_ocel.py" = ["E402"]
"tests/test_run_sparql_gates.py" = ["E402"]
"tests/test_swegym_live.py" = ["E402"]
"tests/test_terraform_docker_apply.py" = ["E402"]
"tests/test_two_gym_gate.py" = ["E402"]

[tool.uv.build-backend]
module-root = "src"
module-name = "gymact"
