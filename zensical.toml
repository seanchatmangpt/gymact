[project]
site_name = "GymAct"
site_description = "Public-semantic execution profile for bounded benchmark worlds"
site_author = "Sean Chatman"
site_url = "https://seanchatmangpt.github.io/gymact"
repo_url = "https://github.com/seanchatmangpt/gymact"
repo_name = "seanchatmangpt/gymact"
copyright = "&copy; 2026 Sean Chatman"
strict = true
watch = ["src"]
nav = [
  { Home = "index.md" },
  { Architecture = "architecture.md" },
  { Assurance = "assurance.md" },
  { Reference = "reference.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.superfences]

[project.validation]
omitted_files = "warn"
absolute_links = "warn"
unrecognized_links = "warn"
anchors = "warn"

[project.theme]
features = ["search.highlight"]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = true
show_submodules = true
