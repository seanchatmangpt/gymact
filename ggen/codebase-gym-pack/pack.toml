[pack]
name = "codebase-gym-pack"
version = "0.1.0"
description = "ggen<->GymAct manufacturing bridge for the real, local-git-tracked codebase gym (gymact.gyms.codebase). ontology/profile.ttl and ontology/profile.shacl.ttl are real symlinks to src/gymact/ontology/profile.{ttl,shacl.ttl} (same repo, per .claude/rules/ontology.md). ontology.ttl declares 8 sosa:Procedure capability instances (4 READ: inspect_tree/read_file/inspect_manifest/inspect_git_diff, 4 DO: apply_patch/git_commit/run_test/run_build) grounded in prov:Activity (rdfs:seeAlso on the 4 DO capabilities -- apply_patch/git_commit/run_test/run_build each generate a new working-tree/result state from a prior one) and a skos:Concept/skos:broader operation-domain taxonomy (inspect/mutate/verify) that this pack owns, matching gymact.gyms.codebase.CODEBASE_CAPABILITIES exactly (cross-checked by tests/test_codebase_ontology.py -- ontology and code cannot silently drift). Templates generate a Rust operation catalog, an MCP tool schema, a reference doc, and a cross-check proof test from this pack's own ontology.ttl -- the same generation pattern as ggen/multicloud-gym-pack and ggen/gymact-bridge-pack, applied here to this gym's real 8 capabilities. gymact.gyms.codebase.CodebaseEnvironment is REAL, not simulated: a real temporary git worktree, real git/pytest/py_compile subprocesses, requires_authority defaulting True for every DO actuation -- see that module's own docstring."
