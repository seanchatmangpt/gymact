[pack]
name = "multicloud-gym-pack"
version = "0.1.0"
description = "ggen<->GymAct manufacturing bridge for the simulated AWS/Azure/GCP multicloud gym (gymact.gyms.multicloud). ontology/profile.ttl and ontology/profile.shacl.ttl are real symlinks to src/gymact/ontology/profile.{ttl,shacl.ttl} (same repo, per .claude/rules/ontology.md). ontology.ttl declares 20 sosa:Procedure capability instances across AWS/Azure/GCP IAM/storage/compute, grounded in odrl:Permission (policy-attachment/role-assignment operations, each with a real OWL-Time time:Interval authority-window via dct:temporal), org:Role (IAM role creation) and org:OrganizationalUnit (account/subscription/project containment, as skos:Concepts in a resource-kind scheme), dcat:Distribution (storage-container creation), prov:Entity/prov:Activity (compute provisioning), and a skos:Concept/skos:broader provider x service-domain taxonomy over all 20 capabilities -- each addition backed by a live fetch of its spec, documented inline in ontology.ttl's own header, alongside explicit rejection notes for dqv/qudt/GeoSPARQL/dpv/spdx/foaf. Templates generate a Rust operation catalog, an MCP tool schema, a reference doc, and a cross-check proof test from this pack's own ontology.ttl -- the same generation pattern as ggen/gymact-bridge-pack (GymAct's own 4 built-in operations) and ggen/consumer-bridge-pack-template (the generic external-consumer template), applied here to this gym's real 20 capabilities. gymact.gyms.multicloud itself is SIMULATED: real in-memory state, zero real cloud SDK calls, zero credentials, zero cost or infrastructure risk -- see that module's own docstring."
