[pack]
name = "gymact-bridge-pack"
version = "0.4.0"
description = "The ggen<->GymAct Rust/WIT/WASM manufacturing bridge for the real FastMCP production surface. ontology/profile.ttl and ontology/profile.shacl.ttl are real symlinks to src/gymact/ontology/profile.{ttl,shacl.ttl}, so generated projections are validated against the same GymAct capability profile the Python package exports. The admitted ABox now covers all 10 @mcp.tool() procedures in src/gymact/surfaces/fastmcp.py: six READ procedures (discover, capabilities, observe, verify, checkpoint, probe_repo) and four consequential envelopes (create_episode, act, restore, teardown). The generic act surface is explicitly related to MCP ConditionalEffect because candidate/court modes are powerless while selected/request modes may reach BRCE; dct:requires records the authority boundary for consequential operations. ggen independently projects the same graph into an MCP tool schema, typed Rust operation catalog, reference documentation, and a cross-projection proof. Adding or removing a FastMCP tool without a matching ontology procedure is refused by tests/test_fastmcp_ontology_closure.py. Generated artifacts do not acquire execution authority: MCP validity and generation remain structurally distinct from GymAct capability scope, AuthorityResolver, BRCE, receipts, and runtime standing."
