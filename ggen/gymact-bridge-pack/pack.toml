[pack]
name = "gymact-bridge-pack"
version = "0.3.0"
description = "The ggen<->GymAct Rust/WIT/WASM manufacturing bridge, living inside this repo (see .claude/rules/ggen-boundary.md for the conceptual split: ggen manufactures the Rust-native side of GymAct from the same admitted semantic graph the Python surfaces compose from). ontology/profile.ttl and ontology/profile.shacl.ttl are real symlinks to src/gymact/ontology/profile.{ttl,shacl.ttl} -- the SAME files this package's own `gymact export-profile` CLI exports, not a copy. There is no drift-check script here because there is nothing that can drift: it is the identical file on disk. Proves the one ggen generation capability that had no prior precedent when this pack was first built (in the sibling ggen repo, before being moved here): sosa:Procedure capability facts, admitted in ontology.ttl, projected into a generated MCP tool schema, a typed Rust operation catalog, a Diataxis reference doc, and a cross-checked coverage proof test, all validated at sync time against this package's own real SHACL shape (urn:gymact:shape:capability). Models 4 of the real 8 gymact.models.Operation values (discover/observe/act/verify); carries no authority-related facts, since GymAct's authority machinery (AuthorityResolver) is Python-runtime-only and not yet represented in RDF. Historically verified from ~/ggen via crates/ggen-engine/tests/gymact_bridge_pack_e2e.rs (cross-repo, named-skip if this repo is absent); that test was removed from ~/ggen in commit 766eee13f (\"feat(dspy-pack): full DSPy coverage + PackRef::Git subdir support\"), whose message names it among files whose content no longer matched that codebase -- it is no longer a currently-checkable contract. Current verification is from this repo via `just ggen-bridge-check` (a real `ggen sync run` against a fresh consumer, asserting the 4 generated files exist) plus a real `ggen sync run` re-confirmed live against `rust/protocol_gym` during the 2026-08-11 pack review."
