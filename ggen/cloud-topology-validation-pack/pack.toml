[pack]
name = "cloud-topology-validation-pack"
version = "0.1.0"
description = """
Generates gymact.gyms.cloud_topology_validation (and its CLI script + Chicago-style test
file) from a real ontology of provider validation policy, replacing a hand-written module
that encoded the same policy only in Python prose. Motivating defect: cloud_topology.py's
AWS loader shipped a real dangling-region-reference bug (229 pseudo-region endpoint-alias
keys mixed into service_region_availability) that the hand-written validator caught -- but
the validator's own reason-code vocabulary, per-provider staleness threshold, and
degenerate-services exception had no durable, independently-checkable source of truth
themselves, only a comment. This pack makes cv:ValidationInvariant individuals and
cv:CloudProvider policy facts (cv:staleAfterDays, cv:hasDegenerateServices,
cv:loaderFunction, cv:independentRecountFunction) the one real source; templates only echo
them (per pack-authoring-pack's "templates echo, they never synthesize" rule), and
`ggen receipt verify`'s BLAKE3 chain is the durable, external proof that what's on disk in
src/gymact/gyms/cloud_topology_validation.py was actually produced from ontology.ttl --
the same "an actor must not also be the judge of its own outcome" discipline the prior
hand-written module's own docstring already invoked (citing gymact/verification.py and
combinatorial_ocel.py's validate_ocel_log), now enforced by ggen's pipeline instead of by a
comment that could silently drift from the code.

cloud_topology.py itself (the live botocore/Azure-snapshot/GCP-snapshot loader) is
deliberately NOT generated by this pack -- it is imperative I/O against external,
non-ontological sources, not a projection of admitted RDF facts. Only the invariant schema
and per-provider re-derivation/staleness policy -- genuinely fixed rules applied uniformly
across three providers -- is ontology-driven here.

Ships one gate (gates/010_provider_policy_validity.rq) admitting the ontology itself: every
cv:CloudProvider must carry exactly one cv:loaderFunction and one
cv:independentRecountFunction, and cv:staleAfterDays (when present) must be a positive
integer -- refusing a malformed policy fact before it can render into a template that
"echoes" it uncritically.
"""
