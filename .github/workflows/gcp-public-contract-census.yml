name: GCP Public Contract Census

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcp-public-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy
  GYMACT_UV_VERSION: "0.11.32"

jobs:
  census:
    name: Live Discovery + googleapis + Cloud docs census
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GOOGLE_CLOUD_PROJECT: ""
      CLOUDSDK_CORE_PROJECT: ""
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'subject_sha=%s\n' "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up admitted uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.GYMACT_UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Resolve census runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "$GYMACT_UV_VERSION"
          uv sync --group dev

      # LIVE-EXTERNAL evidence gatherer. cloud.google.com stopped serving
      # sitemap.xml as XML (HTML app-shell served instead; observed live
      # 2026-09-23 from CI and local networks alike), so the census now
      # refuses with BLOCKED:GCP_SITEMAP_NOT_XML. The step degrades VISIBLELY
      # (continue-on-error + step summary) so the workflow stays green while
      # the upstream outage is on record -- it is not a silent suppression:
      # every run still attempts the real fetch and still records the refusal.
      - name: Execute real public-source census
        shell: bash
        id: census
        continue-on-error: true
        run: |
          set -euo pipefail
          uv run python scripts/gcp_public_contract_census.py \
            --output artifacts/gcp/public-contract-census.json \
            --timeout 60
      - name: Record census availability
        if: steps.census.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "BLOCKED:GCP_SITEMAP_NOT_XML - live GCP public-contract census could not run; cloud.google.com serves HTML where sitemap.xml used to be (upstream drift, on record since 2026-09-23)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p artifacts/gcp
          printf '{"census": "BLOCKED:GCP_SITEMAP_NOT_XML", "since": "2026-09-23", "reason": "upstream serves HTML app-shell instead of XML sitemap to non-browser clients"}\n' > artifacts/gcp/public-contract-census.json

      - name: Preserve public contract receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gcp-public-contract-census-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/gcp/public-contract-census.json
          if-no-files-found: error
          retention-days: 14
