name: EXPLORE Process Trace Correspondence Exact Head

on:
  pull_request:
    paths:
      - 'src/gymact/explore_process_trace_correspondence/**'
      - 'tests/explore_process_trace_correspondence/**'
      - '.github/workflows/explore-process-trace-correspondence.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: PYTHONPATH=src python -m compileall -q src/gymact/explore_process_trace_correspondence tests/explore_process_trace_correspondence
      - name: Behavioral differential refusal and Chicago courts
        run: PYTHONPATH=src python -m unittest discover -s tests/explore_process_trace_correspondence -p 'test_*.py' -v
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Ruff static
        run: ruff check src/gymact/explore_process_trace_correspondence tests/explore_process_trace_correspondence
      - name: Ruff format
        run: ruff format --check src/gymact/explore_process_trace_correspondence tests/explore_process_trace_correspondence
      - name: No ambient consequential actuation
        run: '! grep -REn "requests\\.(post|put|patch|delete)|subprocess\\.|os\\.system|boto3|azure\\.|google\\.cloud" src/gymact/explore_process_trace_correspondence'
