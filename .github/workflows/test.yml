name: v26.8.7 contract

on:
  push:
    branches: [main, release/v26.8.7]
  pull_request:

permissions:
  contents: read

jobs:
  lock:
    name: Resolve dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Resolve and validate lock
        run: |
          uv lock
          uv lock --check
      - uses: actions/upload-artifact@v4
        with:
          name: gymact-v26.8.7-lock
          path: uv.lock

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --all-extras --group dev
      - name: Semantic and runtime tests
        run: uv run coverage run -m pytest
      - name: Coverage
        run: uv run coverage report
      - name: Ruff
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and sdist
        run: uv build
      - name: Validate metadata
        run: uvx twine check dist/*
      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/gymact-wheel
          /tmp/gymact-wheel/bin/pip install dist/*.whl
          /tmp/gymact-wheel/bin/gymact version
          /tmp/gymact-wheel/bin/gymact validate-profile
          /tmp/gymact-wheel/bin/gymact export-profile /tmp/exported-profile
          test -s /tmp/exported-profile/profile.ttl
          test -s /tmp/exported-profile/profile.shacl.ttl
      - uses: actions/upload-artifact@v4
        with:
          name: gymact-v26.8.7-dist
          path: dist/

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install project and docs dependencies
        run: uv sync --group dev
      - name: Build strict documentation
        run: uv run zensical build --clean

  container:
    name: Build and probe production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target production -t gymact:26.8.7 .
      - name: Probe CLI and HTTP health
        run: |
          docker run --rm gymact:26.8.7 version
          cid="$(docker run -d -p 127.0.0.1:8000:8000 gymact:26.8.7)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q 'ALIVE'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid"
          exit 1
