name: v26.8.7 contract

on:
  push:
    branches: [main, release/v26.8.7]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --all-extras --group dev
      - name: Semantic and runtime tests
        run: uv run coverage run -m pytest
      - name: Coverage
        run: uv run coverage report
      - name: Ruff
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and sdist
        run: uv build
      - name: Validate metadata
        run: uvx twine check dist/*
      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/gymact-wheel
          /tmp/gymact-wheel/bin/pip install dist/*.whl
          /tmp/gymact-wheel/bin/gymact version
          /tmp/gymact-wheel/bin/gymact validate-profile
