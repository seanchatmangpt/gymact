name: Collective skill court exact head

on:
  pull_request:
    paths:
      - "src/gymact/skill_court.py"
      - "src/gymact/dcm.py"
      - "tests/test_collective_skill_court.py"
      - ".github/workflows/collective-skill-court.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collective-skill-court:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf "collective_skill_gymact_exact_head=%s\n" "$actual"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Resolve admitted dependency closure
        run: uv sync --group dev

      - name: Compile court surface
        run: >-
          uv run python -m compileall -q
          src/gymact/skill_court.py
          tests/test_collective_skill_court.py

      - name: Execute Oracle NOP mutation DCM court
        run: uv run pytest -q tests/test_collective_skill_court.py

      - name: Static contract
        run: >-
          uv run ruff check
          src/gymact/skill_court.py
          src/gymact/dcm.py
          tests/test_collective_skill_court.py

      - name: Format contract
        run: >-
          uv run ruff format --check
          src/gymact/skill_court.py
          src/gymact/dcm.py
          tests/test_collective_skill_court.py
