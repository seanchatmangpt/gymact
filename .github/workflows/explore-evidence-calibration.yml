name: EXPLORE evidence calibration exact-head

on:
  pull_request:
    paths:
      - "src/gymact/explore_evidence_calibration/**"
      - "tests/explore_evidence_calibration/**"
      - ".github/workflows/explore-evidence-calibration.yml"

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install admitted uv toolchain
        run: python -m pip install 'uv==0.11.32'
      - name: Resolve repository dependency closure
        run: uv sync --group dev
      - name: Compile
        run: uv run python -m compileall -q src/gymact/explore_evidence_calibration tests/explore_evidence_calibration
      - name: Focused differential refusal replay court
        env:
          PYTHONPATH: src
        run: uv run python -m unittest discover -s tests/explore_evidence_calibration -p 'test_*.py' -v
      - name: Ruff static contract
        run: uv run ruff check src/gymact/explore_evidence_calibration tests/explore_evidence_calibration
      - name: Ruff format contract
        run: uv run ruff format --check src/gymact/explore_evidence_calibration tests/explore_evidence_calibration
      - name: Refuse ambient DO
        env:
          PYTHONPATH: src
        run: |
          uv run python - <<'PY'
          from gymact.explore_evidence_calibration.engine import require_do
          try:
              require_do()
          except ValueError as exc:
              assert str(exc) == "REFUSED_UNRECEIPTED_ACTUATION"
          else:
              raise SystemExit("DO unexpectedly admitted")
          PY
