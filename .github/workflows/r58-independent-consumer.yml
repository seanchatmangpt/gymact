name: R58 Independent R57 Consumer

on:
  pull_request:
    paths:
      - 'verification/r58-consumer/**'
      - 'receipts/verify/2026-08-25-r58-independent-consumer.json'
      - '.github/workflows/r58-independent-consumer.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact consumer subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact consumer head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install bounded RDF verifier
        run: python -m pip install --disable-pip-version-check 'rdflib==7.1.4' 'pytest==8.3.5'
      - name: Execute target-local consumer courts
        run: |
          python verification/r58-consumer/run_court.py
          pytest -q verification/r58-consumer/test_court.py
      - name: Checkout exact canonical producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seanchatmangpt/ggen-marketplace
          ref: 8bd29043a2818a5fb6a4de65cc403eff8e495b58
          path: _r57_producer
          persist-credentials: false
      - name: Reuse canonical producer contract court
        run: pytest -q _r57_producer/packs/epistemic-sensor-factory-pack/tests/test_r57_adapter_capital_contract.py
      - name: Prove zero ambient consequential actuation
        run: |
          test "$(python -c 'import json; print(str(json.load(open("verification/r58-consumer/subject.json"))["consequential_do"]).lower())')" = "false"
          test "$(python -c 'import json; print(json.load(open("verification/r58-consumer/last-receipt.json"))["standing"])')" = "ALIVE"
