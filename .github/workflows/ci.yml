name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy
  GYMACT_UV_VERSION: "0.11.32"

jobs:
  core:
    name: Python ${{ matrix.python }} semantic/runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      GYMACT_ALLOW_DEGRADED_STANDINGS: "*"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact head and required workflow graph
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          for workflow in ci.yml release.yml enterprise-connection-crown.yml; do
            test -f ".github/workflows/$workflow" || {
              echo "REFUSED:MISSING_REQUIRED_WORKFLOW:$workflow" >&2
              exit 1
            }
          done
          count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"
          printf 'subject_sha=%s workflow_count=%s\n' "$EXPECTED_SHA" "$count"

      - name: Admit runner checkout path
        shell: bash
        run: |
          set -euo pipefail
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/gymact"
          test "$(readlink -f "$HOME/gymact")" = "$(readlink -f "$GITHUB_WORKSPACE")"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up admitted uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.GYMACT_UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Resolve admitted dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "$GYMACT_UV_VERSION"
          uv sync --extra gyms --extra bpmn --extra dspy --group dev

      - name: Provision real kubectl + kind cluster
        uses: helm/kind-action@v1
        with:
          install_only: false

      - name: Provision real terraform binary
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Semantic profile admission
        run: uv run gymact validate-profile

      - name: Refuse interaction-verifying test seams
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import ast
          from pathlib import Path

          violations: list[str] = []
          forbidden_modules = {"unittest.mock", "mock", "pytest_mock"}

          def record(path: Path, node: ast.AST, reason: str) -> None:
              violations.append(f"{path}:{getattr(node, 'lineno', 0)}:{reason}")

          for path in sorted(Path("tests").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name in forbidden_modules or alias.name.startswith("unittest.mock."):
                              record(path, node, f"forbidden-import:{alias.name}")
                  elif isinstance(node, ast.ImportFrom):
                      module = node.module or ""
                      imported = {alias.name for alias in node.names}
                      if module in forbidden_modules or module.startswith("unittest.mock."):
                          record(path, node, f"forbidden-import-from:{module}")
                      if module == "unittest" and "mock" in imported:
                          record(path, node, "forbidden-import-from:unittest.mock")
                  elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      args = {
                          arg.arg
                          for arg in [*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs]
                      }
                      if "mocker" in args:
                          record(path, node, "pytest-mock-fixture:mocker")
                  elif isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if (
                          isinstance(node.func.value, ast.Name)
                          and node.func.value.id == "monkeypatch"
                          and node.func.attr in {"setattr", "delattr"}
                      ):
                          record(path, node, f"behavior-substitution:monkeypatch.{node.func.attr}")

          if violations:
              print("\n".join(violations))
              raise SystemExit("REFUSED:INTERACTION_VERIFYING_TEST_SEAM")
          print("interaction_verifying_test_seams=0")
          PY

      - name: Runtime and evidence tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-evidence
          uv run coverage run -m pytest -v \
            --junitxml="artifacts/test-evidence/junit-${{ matrix.python }}.xml"

      - name: Coverage and static contract
        shell: bash
        run: |
          set -euo pipefail
          uv run coverage report
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Upload matrix standing evidence (act-local, v3 avoids act's WebCrypto bug)
        if: ${{ env.ACT }}
        uses: actions/upload-artifact@v3
        with:
          name: test-evidence-${{ matrix.python }}
          path: artifacts/test-evidence/junit-${{ matrix.python }}.xml
          if-no-files-found: error

      - name: Upload matrix standing evidence
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-evidence-${{ matrix.python }}
          path: artifacts/test-evidence/junit-${{ matrix.python }}.xml
          if-no-files-found: error
          retention-days: 14

  cloudsim:
    name: Zero-live-cloud AWS/Azure/GCP simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GYMACT_ALLOW_DEGRADED_STANDINGS: "*"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_PROFILE: ""
      AWS_EC2_METADATA_DISABLED: "true"
      AZURE_CLIENT_ID: ""
      AZURE_CLIENT_SECRET: ""
      AZURE_TENANT_ID: ""
      AZURE_SUBSCRIPTION_ID: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GOOGLE_CLOUD_PROJECT: ""
      CLOUDSDK_CORE_PROJECT: ""
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up admitted uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.GYMACT_UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Resolve simulator verification surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "$GYMACT_UV_VERSION"
          uv sync --group dev

      - name: Prove cloud package has no vendor SDK dependency
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import ast
          from pathlib import Path

          roots = [
              Path("src/gymact/gyms/cloudsim"),
              Path("src/gymact/gyms/multicloud.py"),
          ]
          forbidden = ("boto3", "botocore", "azure", "google.cloud")
          imported = set()
          paths = []
          for root in roots:
              paths.extend(root.glob("*.py") if root.is_dir() else [root])
          for path in paths:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported.update(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imported.add(node.module)
          leaked = sorted(name for name in imported if name.startswith(forbidden))
          if leaked:
              raise SystemExit(f"REFUSED:VENDOR_CLOUD_SDK_IMPORT:{leaked}")
          print("vendor_cloud_sdk_imports=0")
          PY

      - name: Execute cloud worlds with external sockets disabled
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/cloudsim
          uv run --with 'pytest-socket==0.8.0' pytest -v \
            --disable-socket \
            --allow-unix-socket \
            tests/test_multicloud.py \
            tests/test_cloudsim.py \
            --junitxml=artifacts/cloudsim/junit-cloudsim.xml
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "subject_sha": os.environ["SUBJECT_SHA"],
              "standing": "ALIVE",
              "boundary": "cloudsim-zero-live-cloud",
              "clouds": ["aws", "azure", "gcp"],
              "network": "EXTERNAL_SOCKETS_DISABLED",
              "unix_socket": "ALLOWED_FOR_ASYNCIO",
              "credentials": "EMPTY",
              "vendor_cloud_sdk_imports": 0,
              "real_cloud_spend_required": False,
              "authority_semantics": "GYMACT_RUNTIME",
              "receipt_semantics": "GYMACT_RUNTIME",
          }
          path = Path("artifacts/cloudsim/receipt.json")
          path.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
          print(path.read_text(), end="")
          PY

      - name: Upload cloud-simulation receipt (act-local, v3 avoids act's WebCrypto bug)
        if: ${{ env.ACT }}
        uses: actions/upload-artifact@v3
        with:
          name: cloudsim-evidence
          path: artifacts/cloudsim/
          if-no-files-found: error

      - name: Upload cloud-simulation receipt
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cloudsim-evidence
          path: artifacts/cloudsim/
          if-no-files-found: error
          retention-days: 14

  artifact:
    name: wheel/docs/container consequence
    needs: [core, cloudsim]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact artifact subject
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download cloud-simulation evidence (act-local, v3 avoids act's WebCrypto bug)
        if: ${{ env.ACT }}
        uses: actions/download-artifact@v3
        with:
          name: cloudsim-evidence
          path: artifacts/cloudsim-evidence

      - name: Download cloud-simulation evidence
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: cloudsim-evidence
          path: artifacts/cloudsim-evidence

      # v3 has no pattern/merge-multiple (v4+-only download-artifact features),
      # so under act each test-evidence-<python> artifact is fetched into its
      # own subdir, then flattened to match the real (!env.ACT) merge-multiple
      # layout the receipt-generation step below expects.
      - name: Download Python matrix evidence (act-local, v3 avoids act's WebCrypto bug)
        if: ${{ env.ACT }}
        uses: actions/download-artifact@v3
        with:
          path: artifacts/test-evidence-raw

      - name: Flatten act-local matrix evidence
        if: ${{ env.ACT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-evidence
          find artifacts/test-evidence-raw -name 'junit-*.xml' -exec cp {} artifacts/test-evidence/ \;

      - name: Download Python matrix evidence
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: test-evidence-*
          path: artifacts/test-evidence
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up admitted uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.GYMACT_UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Resolve build and documentation surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "$GYMACT_UV_VERSION"
          uv sync --group dev

      - name: Build and independently install wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist /tmp/gymact-wheel /tmp/exported-profile /tmp/manufacturing-bundle
          uv run python -m build
          uv run python -m twine check dist/*
          uv venv /tmp/gymact-wheel --python 3.13
          uv pip install --python /tmp/gymact-wheel/bin/python \
            'wasm4pm-compat-pydantic @ git+https://github.com/seanchatmangpt/wasm4pm-compat.git@577e2d1d8bdfe27d96f61c63f3ea120994e8bfda#subdirectory=python'
          uv pip install --python /tmp/gymact-wheel/bin/python dist/*.whl
          /tmp/gymact-wheel/bin/gymact version
          /tmp/gymact-wheel/bin/gymact validate-profile
          /tmp/gymact-wheel/bin/gymact contract > /tmp/runtime-contract.json
          /tmp/gymact-wheel/bin/gymact export-profile /tmp/exported-profile
          /tmp/gymact-wheel/bin/gymact export-bundle /tmp/manufacturing-bundle
          test -s /tmp/exported-profile/profile.ttl
          test -s /tmp/exported-profile/profile.shacl.ttl
          test -s /tmp/manufacturing-bundle/profile.ttl
          test -s /tmp/manufacturing-bundle/profile.shacl.ttl
          test -s /tmp/manufacturing-bundle/runtime-contract.jcs.json
          /tmp/gymact-wheel/bin/python - <<'PY'
          import json
          from pathlib import Path

          from gymact import build_contract
          from gymact.evidence import canonical_bytes

          observed = json.loads(Path("/tmp/runtime-contract.json").read_text())
          contract = build_contract()
          assert observed["contract_digest"] == contract.contract_digest
          bundle = Path("/tmp/manufacturing-bundle/runtime-contract.jcs.json").read_bytes()
          assert bundle == canonical_bytes(contract.model_dump(mode="json"))
          PY

      - name: Build documentation
        run: uv run zensical build --clean

      - name: Build and probe production container
        shell: bash
        run: |
          set -euo pipefail
          docker build --target production -t gymact:ci .
          docker run --rm gymact:ci version
          docker run --rm gymact:ci contract | grep -q 'contract_digest'
          cid="$(docker run -d -p 127.0.0.1:8000:8000 gymact:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q 'ALIVE'; then
              curl -fsS http://127.0.0.1:8000/contract | grep -q 'RFC8785-JCS'
              curl -fsS http://127.0.0.1:8000/evidence | grep -q 'verified'
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid"
          exit 1

      - name: Emit verification receipt
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          PACKAGE_VERSION="$(/tmp/gymact-wheel/bin/python -c 'from importlib.metadata import version; print(version("gymact"))')"
          export PACKAGE_VERSION
          uv run python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = sorted(Path("artifacts/test-evidence").glob("junit-*.xml"))
          if len(reports) != 3:
              raise SystemExit(f"expected 3 matrix reports, found {len(reports)}")
          cloud_receipts = list(Path("artifacts/cloudsim-evidence").rglob("receipt.json"))
          if not cloud_receipts:
              raise SystemExit("cloud-simulation receipt is missing")

          skipped = 0
          tests = 0
          for report in reports:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              for suite in suites:
                  tests += int(suite.attrib.get("tests", 0))
                  skipped += int(suite.attrib.get("skipped", 0))

          cloud = json.loads(cloud_receipts[0].read_text())
          if cloud.get("subject_sha") != os.environ["SUBJECT_SHA"]:
              raise SystemExit("cloud-simulation receipt subject does not match exact head")
          if cloud.get("standing") != "ALIVE":
              raise SystemExit("cloud-simulation standing is not ALIVE")
          if cloud.get("network") != "EXTERNAL_SOCKETS_DISABLED":
              raise SystemExit("external network boundary was not disabled")
          if cloud.get("unix_socket") != "ALLOWED_FOR_ASYNCIO":
              raise SystemExit("asyncio Unix-socket boundary was not explicit")
          if cloud.get("credentials") != "EMPTY" or cloud.get("real_cloud_spend_required") is not False:
              raise SystemExit("cloud-simulation receipt does not prove zero-spend boundary")
          if cloud.get("vendor_cloud_sdk_imports") != 0:
              raise SystemExit("cloud-simulation receipt does not prove SDK isolation")

          required_workflows = {"ci.yml", "release.yml", "enterprise-connection-crown.yml"}
          workflow_files = sorted(
              path.name
              for path in Path(".github/workflows").iterdir()
              if path.is_file() and path.suffix in {".yml", ".yaml"}
          )
          missing = sorted(required_workflows.difference(workflow_files))
          if missing:
              raise SystemExit(f"required workflows missing at receipt boundary: {missing}")

          subject_standing = "ALIVE" if skipped == 0 else "PARTIAL_ALIVE"
          reason = (
              "ALL_REQUIRED_BOUNDARIES_EXECUTED_WITHOUT_DEGRADATION"
              if skipped == 0
              else "EXPLICIT_DEGRADED_STANDINGS_OBSERVED"
          )
          receipt = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "subject_sha": os.environ["SUBJECT_SHA"],
              "package_version": os.environ["PACKAGE_VERSION"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "standing": subject_standing,
              "verifier_standing": "ALIVE",
              "reason": reason,
              "degraded_standings_allowed": "*",
              "pytest_tests": tests,
              "pytest_skipped": skipped,
              "workflow_count": len(workflow_files),
              "workflow_files": workflow_files,
              "dependency_resolver": "uv",
              "uv_version": os.environ["GYMACT_UV_VERSION"],
              "cloudsim_zero_live_cloud": True,
              "boundaries": [
                  "python-3.11",
                  "python-3.12",
                  "python-3.13",
                  "semantic-profile",
                  "runtime-evidence-tests",
                  "cloudsim-zero-live-cloud",
                  "wheel-install",
                  "runtime-contract-equivalence",
                  "docs",
                  "container",
              ],
          }
          path = Path("artifacts/ci/receipt.json")
          path.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
          print(path.read_text(), end="")
          PY

      - name: Upload verified delivery bundle (act-local, v3 avoids act's WebCrypto bug)
        if: ${{ env.ACT }}
        uses: actions/upload-artifact@v3
        with:
          name: ci-bundle-${{ github.run_id }}
          path: |
            artifacts/ci/receipt.json
            dist/*
            site/
          if-no-files-found: error

      - name: Upload verified delivery bundle
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-bundle-${{ github.run_id }}
          path: |
            artifacts/ci/receipt.json
            dist/*
            site/
          if-no-files-found: error
          retention-days: 14
