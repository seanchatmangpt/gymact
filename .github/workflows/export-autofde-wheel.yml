name: Export AutoFDE Wheel

on:
  push:
    branches:
      - agent/export-autofde-wheel

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 24bd68a8c9e59ee42a4a2eeea9fc12d79fe75f5b
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Build exact wheel
        run: uv build --wheel
      - name: Record identity
        run: |
          sha256sum dist/*.whl > dist/SHA256SUMS
          printf '%s\n' '24bd68a8c9e59ee42a4a2eeea9fc12d79fe75f5b' > dist/SOURCE_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: gymact-wheel-24bd68a8c9e59ee42a4a2eeea9fc12d79fe75f5b
          path: |
            dist/*.whl
            dist/SHA256SUMS
            dist/SOURCE_COMMIT
          if-no-files-found: error
