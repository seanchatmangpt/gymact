name: EXPLORE Replicated Projection Quorum Exact Head

on:
  pull_request:
    paths:
      - 'src/gymact/explore_replicated_projection_quorum/**'
      - 'tests/explore_replicated_projection_quorum/**'
      - '.github/workflows/explore-replicated-projection-quorum.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile authored subject
        run: python -m compileall -q src/gymact/explore_replicated_projection_quorum tests/explore_replicated_projection_quorum
      - name: Execute permanent differential court
        env:
          PYTHONPATH: src:tests/explore_replicated_projection_quorum
        run: python -m unittest discover -s tests/explore_replicated_projection_quorum -p 'test_rpq_*.py' -v
      - name: Refuse ambient consequential actuation
        shell: bash
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud|socket\.' src/gymact/explore_replicated_projection_quorum
