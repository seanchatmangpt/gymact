name: GymActEx Chicago

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "beam/gymact_ex/**"
      - "scripts/chicago_gymact_ex.sh"
      - "scripts/chicago_gymact_ex_server.py"
      - "src/gymact/models.py"
      - "src/gymact/kernel.py"
      - "src/gymact/runtime.py"
      - "src/gymact/providers.py"
      - "src/gymact/contract.py"
      - "src/gymact/surfaces/fastapi.py"
      - ".github/workflows/gymact-ex.yml"

permissions:
  contents: read

jobs:
  chicago:
    name: real FastAPI -> GymAct -> MemoryProvider
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Run no-mock cross-runtime Chicago court
        run: bash scripts/chicago_gymact_ex.sh
