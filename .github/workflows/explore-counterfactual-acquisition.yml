name: EXPLORE Counterfactual Acquisition Exact Head

on:
  pull_request:
    paths:
      - "src/gymact/explore_counterfactual_acquisition/**"
      - "tests/explore_counterfactual_acquisition/**"
      - ".github/workflows/explore-counterfactual-acquisition.yml"

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact pull request head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv>=0.11.32,<0.12"
      - name: Resolve locked development environment
        run: uv sync --group dev
      - name: Compile counterfactual acquisition frontier
        run: >-
          uv run python -m compileall -q
          src/gymact/explore_counterfactual_acquisition
          tests/explore_counterfactual_acquisition
      - name: Execute differential refusal replay and Chicago courts
        run: >-
          uv run python -m unittest discover
          -s tests/explore_counterfactual_acquisition
          -p 'test_*.py' -v
      - name: Ruff static court
        run: >-
          uv run ruff check
          src/gymact/explore_counterfactual_acquisition
          tests/explore_counterfactual_acquisition
      - name: Ruff format court
        run: >-
          uv run ruff format --check
          src/gymact/explore_counterfactual_acquisition
          tests/explore_counterfactual_acquisition
      - name: Reject ambient consequential actuation surfaces
        shell: bash
        run: |
          if grep -REn 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' src/gymact/explore_counterfactual_acquisition; then
            exit 1
          fi
