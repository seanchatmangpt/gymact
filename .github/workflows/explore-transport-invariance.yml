name: Explore Transport Invariance

on:
  pull_request:
    paths:
      - 'src/gymact/explore_transport_invariance/**'
      - 'tests/explore_transport_invariance/**'
      - '.github/workflows/explore-transport-invariance.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: astral-sh/setup-uv@v7
      - name: Sync declared dev closure
        run: uv sync --group dev
      - name: Compile
        run: uv run python -m compileall -q src/gymact/explore_transport_invariance tests/explore_transport_invariance
      - name: Focused behavioral and refusal courts
        run: uv run pytest -q tests/explore_transport_invariance
      - name: Static analysis
        run: uv run ruff check src/gymact/explore_transport_invariance tests/explore_transport_invariance
      - name: Format contract
        run: uv run ruff format --check src/gymact/explore_transport_invariance tests/explore_transport_invariance
      - name: No ambient consequential actuation
        run: '! grep -REn "requests\\.(post|put|patch|delete)|subprocess\\.|os\\.system|boto3|azure\\.|google\\.cloud" src/gymact/explore_transport_invariance'
