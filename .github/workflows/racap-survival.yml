name: RACaP survival pairing exact head

on:
  pull_request:
    paths:
      - "src/gymact/racap_paired_world.py"
      - "src/gymact/racap_survival.py"
      - "src/gymact/survival_experiment.py"
      - "src/gymact/dcm.py"
      - "tests/test_racap_paired_world.py"
      - "tests/test_racap_paired_runner.py"
      - "tests/test_racap_survival.py"
      - ".github/workflows/racap-survival.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  racap-survival:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'racap_survival_exact_head=%s\n' "$actual"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Resolve admitted dependency closure
        run: uv sync --group dev

      - name: Execute paired survival court
        run: >-
          uv run pytest -q
          tests/test_racap_paired_world.py
          tests/test_racap_paired_runner.py
          tests/test_racap_survival.py

      - name: Static contract
        run: >-
          uv run ruff check
          src/gymact/racap_paired_world.py
          src/gymact/racap_survival.py
          src/gymact/survival_experiment.py
          src/gymact/dcm.py
          tests/test_racap_paired_world.py
          tests/test_racap_paired_runner.py
          tests/test_racap_survival.py

      - name: Format contract
        run: >-
          uv run ruff format --check
          src/gymact/racap_paired_world.py
          src/gymact/racap_survival.py
          src/gymact/survival_experiment.py
          src/gymact/dcm.py
          tests/test_racap_paired_world.py
          tests/test_racap_paired_runner.py
          tests/test_racap_survival.py
