name: EXPLORE intent freshness frontier

on:
  pull_request:
    paths:
      - "src/gymact/explore_intent_frontier/**"
      - "tests/explore_intent_frontier/**"
      - ".github/workflows/explore-intent-frontier.yml"

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up admitted uv
        run: python -m pip install "uv==0.11.32"
      - name: Resolve admitted dependency graph
        run: uv sync --group dev
      - name: Compile authored surface
        run: uv run python -m compileall -q src/gymact/explore_intent_frontier tests/explore_intent_frontier
      - name: Execute differential refusal replay court
        run: uv run python -m unittest discover -s tests/explore_intent_frontier -p 'test_*.py' -v
      - name: Canonicalize Ruff repair candidate
        run: |
          uv run ruff check --fix --unsafe-fixes src/gymact/explore_intent_frontier tests/explore_intent_frontier || true
          uv run ruff format src/gymact/explore_intent_frontier tests/explore_intent_frontier
          tar -czf /tmp/explore-intent-frontier-ruff-repair.tgz src/gymact/explore_intent_frontier tests/explore_intent_frontier
      - name: Upload canonical repair candidate
        uses: actions/upload-artifact@v4
        with:
          name: explore-intent-frontier-ruff-repair-${{ github.event.pull_request.head.sha }}
          path: /tmp/explore-intent-frontier-ruff-repair.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Strict Ruff static contract after canonicalization
        run: uv run ruff check src/gymact/explore_intent_frontier tests/explore_intent_frontier
      - name: Require authored source to already be canonical
        run: git diff --exit-code -- src/gymact/explore_intent_frontier tests/explore_intent_frontier
